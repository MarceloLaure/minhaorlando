<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Orlando - Redirecionando...</title>
  <link rel="icon" href="/app/icon-192.png" type="image/png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0B1B3A 0%, #1E3A8A 60%, #3B82F6 100%);
      color: #fff; padding: 24px; text-align: center;
    }
    .card {
      max-width: 360px; padding: 28px 24px; border-radius: 24px;
      background: rgba(255,255,255,0.08); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    .icon { font-size: 56px; margin-bottom: 14px; }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    p { font-size: 14px; opacity: 0.9; line-height: 1.5; margin-bottom: 18px; }
    .spinner {
      width: 32px; height: 32px; margin: 0 auto;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a {
      display: inline-block; margin-top: 18px;
      padding: 12px 22px; border-radius: 999px;
      background: #fff; color: #1E3A8A;
      text-decoration: none; font-weight: 800; font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✨</div>
    <h1>Minha Orlando</h1>
    <p>O app mudou de endereço. Te levando pra <strong>/app</strong>...</p>
    <div class="spinner"></div>
    <a href="/app/">Abrir agora</a>
  </div>

  <script>
    // Migracao: limpa SW antigo (registrado em '/') e caches antigos da raiz,
    // depois redireciona pra /app/. Pra quem ja instalou o PWA do '/' antes do move.
    (function () {
      var target = '/app/';
      function redirect() {
        try { window.location.replace(target); }
        catch (_) { window.location.href = target; }
      }

      var jobs = [];

      if ('serviceWorker' in navigator) {
        jobs.push(
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) {
              // So desregistra os que cobrem a raiz (scope '/'), nao o novo /app/
              if (r.scope && r.scope.replace(location.origin, '').replace(/\/$/, '') === '') {
                return r.unregister().catch(function () {});
              }
              return null;
            }));
          }).catch(function () {})
        );
      }

      if ('caches' in window) {
        jobs.push(
          caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) {
              if (k.indexOf('minha-orlando-') === 0) return caches.delete(k).catch(function () {});
              return null;
            }));
          }).catch(function () {})
        );
      }

      // Espera no maximo 1.5s. Se demorar, redireciona mesmo assim.
      var done = false;
      function go() { if (!done) { done = true; redirect(); } }
      Promise.all(jobs).then(go);
      setTimeout(go, 1500);
    })();
  </script>
</body>
</html>
